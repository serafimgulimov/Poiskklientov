<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск бизнесов без сайтов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #1a1a1a;
        }
        h1 { margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header h2 { font-size: 18px; }
        .niche {
            display: inline-block;
            background: #e8f0fe;
            color: #1967d2;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 4px;
        }
        .phone { color: #555; font-size: 14px; margin-bottom: 12px; }
        textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            background: #fafafa;
            margin-bottom: 12px;
        }
        textarea:focus { outline: none; border-color: #1967d2; background: #fff; }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-telegram.disabled {
            background: #ccc;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.6;
        }
        .btn-copy { background: #e0e0e0; color: #333; }
        .empty { text-align: center; padding: 40px; color: #888; }
        .counter { margin-bottom: 16px; color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Бизнесы без сайтов</h1>
        <p class="subtitle">Скопируйте сообщение и откройте чат одним кликом.</p>
        <div id="counter" class="counter"></div>
        <div id="list"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('businesses.json');
                const businesses = await response.json();
                render(businesses);
            } catch (error) {
                document.getElementById('list').innerHTML =
                    '<div class="empty">Ошибка загрузки данных. Проверьте файл businesses.json.</div>';
            }
        }

        function render(businesses) {
            const list = document.getElementById('list');
            const counter = document.getElementById('counter');

            if (!businesses.length) {
                list.innerHTML = '<div class="empty">Список пуст.</div>';
                return;
            }

            counter.textContent = `Всего: ${businesses.length}`;

            list.innerHTML = businesses.map((biz, index) => {
                // Формируем ссылку WhatsApp (текст должен быть URL-закодирован)
                const waText = encodeURIComponent(biz.message);
                const waLink = `https://wa.me/${biz.phone}?text=${waText}`;

                // Формируем ссылку Telegram (только если есть username)
                const tgLink = biz.telegram
                    ? `https://t.me/${biz.telegram}`
                    : '#';
                const tgDisabled = !biz.telegram ? 'disabled' : '';

                return `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2>${escapeHtml(biz.name)}</h2>
                            <span class="niche">${escapeHtml(biz.niche || '—')}</span>
                        </div>
                    </div>
                    <div class="phone">📞 ${escapeHtml(biz.phone || 'Нет телефона')}</div>

                    <textarea id="msg-${index}" readonly>${escapeHtml(biz.message)}</textarea>

                    <div class="actions">
                        <a href="${waLink}" target="_blank" class="btn btn-whatsapp">
                            💬 Открыть WhatsApp
                        </a>
                        <a href="${tgLink}" target="_blank" class="btn btn-telegram ${tgDisabled}">
                            ✈️ Открыть Telegram
                        </a>
                        <button class="btn btn-copy" onclick="copyMessage(${index})">
                            📋 Скопировать текст
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function copyMessage(index) {
            const textarea = document.getElementById(`msg-${index}`);
            textarea.select();
            document.execCommand('copy');
            // Визуальный фидбек
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✅ Скопировано';
            setTimeout(() => { btn.textContent = originalText; }, 1500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadData();
    </script>
</body>
</html>
